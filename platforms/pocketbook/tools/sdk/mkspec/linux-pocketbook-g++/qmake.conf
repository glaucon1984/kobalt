# qmake device spec: Debian's arm-linux-gnueabi GCC 12 paired with the PocketBook SDK 6.5 sysroot
# (glibc 2.23). Mirrors tools/pocketbook-gcc12.toolchain.cmake. Use with
#   configure -device linux-pocketbook-g++ -device-option CROSS_COMPILE=arm-linux-gnueabi-
include(../common/linux_device_pre.conf)
PB_SYSROOT = /work/sdk/SDK-B288/usr/arm-obreey-linux-gnueabi/sysroot
PB_GCC = /usr/lib/gcc-cross/arm-linux-gnueabi/12
PB_CXX = /usr/arm-linux-gnueabi/include/c++/12
PB_FLAGS = --sysroot=$$PB_SYSROOT -B$$PB_SYSROOT/usr/lib/ -march=armv7-a -mfpu=neon -mfloat-abi=softfp -fsigned-char -fno-pie
QMAKE_CFLAGS += $$PB_FLAGS -nostdinc -isystem $$PB_GCC/include -isystem $$PB_SYSROOT/usr/include
QMAKE_CXXFLAGS += $$PB_FLAGS -nostdinc -isystem /work/gcc12-overlay -isystem $$PB_CXX -isystem $$PB_CXX/arm-linux-gnueabi -isystem $$PB_CXX/backward -isystem $$PB_GCC/include -isystem $$PB_SYSROOT/usr/include
QMAKE_LFLAGS += --sysroot=$$PB_SYSROOT -B$$PB_SYSROOT/usr/lib/ -L$$PB_GCC -L$$PB_SYSROOT/lib -L$$PB_SYSROOT/usr/lib -no-pie -static-libstdc++ -static-libgcc -pthread -Wl,-z,noexecstack /work/gcc12-compat/glibc_compat.o
include(../common/linux_device_post.conf)
load(qt_config)
